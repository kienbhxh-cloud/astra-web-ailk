name: ASTRA Skill Agent Runner
on:
  push:
    paths:
      - "09_HOP_THU/MSG_*_LK_*.md"
permissions:
  contents: write
concurrency:
  group: astra-skill-agent
  cancel-in-progress: false
jobs:
  run-skill-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute skill agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: node skills/skill_agent.mjs
      - name: Commit agent reply
        run: |
          git config user.name "ASTRA-Skill-Agent"
          git config user.email "agent@users.noreply.github.com"
          git add 09_HOP_THU/*_REPLY.md
          git diff --staged --quiet || git commit -m "Agent: phản hồi tự động [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
