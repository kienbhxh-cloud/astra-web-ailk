name: ASTRA Club Roundtable v1.2
on:
  push:
    branches: [main]
    paths: ['09_HOP_THU/MSG_*.md']
  workflow_dispatch:
    inputs:
      topic:
        description: 'Exact 09_HOP_THU/MSG_*.md'
        required: true
        type: string
permissions:
  contents: write
concurrency: { group: club-roundtable, cancel-in-progress: false }
jobs:
  roundtable:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip-club]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify provider/skill/club behavior, no paid API
        run: node --test skills/club_providers.test.mjs skills/approved_skill_loader.test.mjs tests/club_roundtable.test.mjs
      - name: Generate fixture-only club minutes
        shell: bash
        env:
          DISPATCH_TOPIC: ${{ inputs.topic }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          : > /tmp/club-generated.txt
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            printf '%s\n' "$DISPATCH_TOPIC" > /tmp/club-topics.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD -- '09_HOP_THU/MSG_*.md' > /tmp/club-topics.txt
          fi
          while IFS= read -r topic; do
            [[ "$topic" == 09_HOP_THU/MSG_*.md ]] || continue
            [[ -f "$topic" ]] || continue
            head -n 20 "$topic" | grep -qiF '[CLUB:ROUNDTABLE]' || continue
            node skills/club_roundtable.mjs --fixture --topic "$topic" | tee /tmp/club-status.txt
            if grep -q '"ok":true' /tmp/club-status.txt; then
              printf '%s\n' "${topic%.md}_CLUB_MINUTES.md" >> /tmp/club-generated.txt
            fi
          done < /tmp/club-topics.txt
      - name: Optional Drive synchronization (secrets limited to this step)
        shell: bash
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          while IFS= read -r minutes; do
            [[ -n "$minutes" ]] || continue
            node skills/club_drive_sync.mjs --minutes "$minutes"
          done < /tmp/club-generated.txt
      - name: Commit reviewed-status-aware outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ASTRA-Club-Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- AI_FEED.md 09_HOP_THU 10_SKILLS/_pending
          if ! git diff --cached --quiet; then
            git commit -m 'ASTRA-Club-Bot: pending-only roundtable minutes [skip-club]'
            git push origin HEAD:main
          fi
