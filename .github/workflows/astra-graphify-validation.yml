name: ASTRA Graphify validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'skills/astra-graphify/**'
      - '.github/workflows/astra-graphify-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0 rfc3339-validator==0.1.4
      - run: python skills/astra-graphify/test_provenance_v12.py -v
