name: ASTRA Graphify validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'skills/astra-graphify/**'
      - 'astra_graphify/**'
      - '.github/workflows/astra-graphify-validation.yml'
  pull_request:
    paths:
      - 'skills/astra-graphify/**'
      - 'astra_graphify/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # rfc3339-validator is required: without it jsonschema silently skips
      # format "date-time" (root cause of the failed run 45534426217).
      - run: python -m pip install -r astra_graphify/requirements.lock
      - run: python skills/astra-graphify/test_provenance_v12.py -v
      - run: python -m unittest discover -s astra_graphify/tests -t . -v
